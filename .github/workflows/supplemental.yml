name: supplemental

# Collect CelesTrak's supplemental (operator-ephemeris) element sets every few hours.
#
# Why this exists. The covariance of an object screened on a supplemental set comes from
# the consistency of successive versions of that set, and CelesTrak serves one version and
# overwrites it. Two versions two hours apart can only measure the error over two hours, so
# the growth law has to be extrapolated to the seven-day screening window, which it cannot
# survive (see docs/screening.md, "The supplemental horizon"). The only fix is time: store
# a version every few hours and the consistency pairs eventually span days rather than
# hours, the fit stops being an extrapolation, and the model's validity horizon moves out
# on its own.
#
# The store lives on its own orphan branch, because data/ is gitignored on main and a
# scheduled job must not commit data into the branch people read the code from. The branch
# is created by the job itself on first run -- it used to be a manual one-off documented in
# this comment, which meant every scheduled run failed silently at the checkout step until
# somebody remembered. Nothing else is needed: CelesTrak's supplemental file takes no
# credentials.
#
# The run's state is split by character, and the split is the point:
#
#   data/supplemental   accumulating and irreplaceable -> the orphan branch. 0.74 MB a
#                       version; the whole value of the store is that it grows for months.
#   data/cache          ephemeral and rebuildable -> the Actions cache. It exists to honour
#                       CelesTrak's two-hour floor, so it only has to remember two hours,
#                       and the cache's own eviction never matters. It must NOT go in git:
#                       the supplemental payload is 5.1 MB of JSON per fetch, seven times
#                       the parquet it produces, and git keeps every version forever.
#
# Without the second half the floor is not honoured at all: a fresh runner has no cache, so
# every run refetches, and `store_supplemental` names versions by fetch time rather than by
# content, so two runs an hour apart store two near-identical 0.74 MB files.

on:
  schedule:
    # Every three hours. CelesTrak's floor is one fetch per group per two hours, and their
    # supplemental files are refitted several times a day, so this is polite and still
    # catches most versions.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      compact_after:
        description: "Compact the store branch once it has more commits than this (default 200)"
        required: false
        default: ""

concurrency:
  group: supplemental-store
  cancel-in-progress: false

permissions:
  contents: write

env:
  STORE_BRANCH: supplemental-store
  # Git keeps every version of every blob for ever, and a supplemental version is 0.74 MB of
  # zstd parquet that deltas against nothing. Measured: three versions committed in sequence
  # cost 2.19 MB of .git for 2.22 MB of files, and deleting two of them left .git at 2.19 MB.
  # So `prune_supplemental` thins the checkout and reclaims nothing at all from the history.
  # At eight runs a day that is 5.9 MB/day, about 2.2 GB a year, against a tip that settles
  # near 340 MB -- and every run pays for the fetch. The store branch is therefore rebuilt
  # from its own tip once it passes this many commits: same tree, one commit, no history.
  # Nothing is lost that matters, because every stored version is named by its own fetch time,
  # so the store is its own log.
  COMPACT_AFTER: 200

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First run bootstraps the store. Done in a scratch directory with its own `git init`,
      # so the first commit is genuinely parentless and the main working tree is never
      # touched by an orphan checkout.
      - name: Ensure the store branch exists
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" "$STORE_BRANCH" >/dev/null 2>&1; then
            echo "Store branch $STORE_BRANCH already exists."
            exit 0
          fi
          echo "Store branch $STORE_BRANCH does not exist; creating it."
          scratch="$(mktemp -d)"
          cd "$scratch"
          git init -q -b "$STORE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' \
            "# driftwatch supplemental store" "" \
            "Data only. The code is on \`main\`; this branch is written by" \
            "\`.github/workflows/supplemental.yml\` and holds nothing else." > README.md
          # The fetch cache is restored into this working tree by actions/cache. It must
          # never be committed: 5.1 MB of JSON a fetch, seven times the parquet it makes.
          echo 'data/cache/' > .gitignore
          git add README.md .gitignore
          git commit -q -m "Supplemental element-set store"
          git push -q "$REPO_URL" "$STORE_BRANCH"
          echo "Created $STORE_BRANCH."

      - name: Check out the store branch
        uses: actions/checkout@v4
        with:
          ref: supplemental-store
          path: store

      - name: What the store held before this run
        working-directory: store
        run: |
          echo "commits on $STORE_BRANCH: $(git rev-list --count HEAD)"
          echo "versions in the store:    $(ls -1 data/supplemental 2>/dev/null | wc -l)"
          ls -1 data/supplemental 2>/dev/null || echo "  (none: first run)"
          echo "checkout size:            $(du -sh data 2>/dev/null | cut -f1 || echo 0)"
          echo "history size (.git):      $(du -sh .git | cut -f1)"

      # Rolling cache: a key that never hits, so it always saves, with a prefix restore that
      # always picks up the newest. This is what makes CelesTrak's two-hour floor hold across
      # runs; losing it costs one polite refetch, never any stored data.
      - name: Restore the fetch cache
        uses: actions/cache@v4
        with:
          path: store/data/cache
          key: celestrak-cache-${{ github.run_id }}
          restore-keys: celestrak-cache-

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --no-dev

      - name: Fetch, store and thin
        env:
          DRIFTWATCH_DATA_DIR: ${{ github.workspace }}/store/data
          DRIFTWATCH_CONTACT: ${{ vars.DRIFTWATCH_CONTACT }}
        run: uv run driftwatch supplemental --fit

      - name: Commit the new version
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A store branch created before the ignore file existed does not have one.
          [ -f .gitignore ] || echo 'data/cache/' > .gitignore
          git add .gitignore
          # The store only. The fetch cache lives in the Actions cache, for the reasons in
          # the header: it is rebuildable, and it is seven times the size of what it produces.
          git add -f data/supplemental
          if git diff --cached --quiet; then
            echo "No new version this run (CelesTrak's two-hour floor, or an unchanged file)."
          else
            # How many commits have landed since the last compaction. See that step for why
            # this is a file rather than `git rev-list --count`.
            echo $(( $(cat data/.commits 2>/dev/null || echo 0) + 1 )) > data/.commits
            git add -f data/.commits
            git commit -m "Supplemental element sets, $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # The counter is a file on the branch, not `git rev-list --count`. `actions/checkout`
      # clones the store at fetch-depth 1 -- which is what keeps every run cheap however long
      # the branch gets -- so `git rev-list --count HEAD` reads 1 for ever and a threshold on
      # it never fires. Found by testing it: the first attempt reported "1 commits, limit 1"
      # on a branch that already had two. A counter in the store is shallow-clone-proof and
      # needs no API call.
      - name: Compact the store branch when its history outgrows its contents
        working-directory: store
        env:
          COMPACT_AFTER_INPUT: ${{ inputs.compact_after }}
        run: |
          limit="${COMPACT_AFTER_INPUT:-$COMPACT_AFTER}"
          commits="$(cat data/.commits 2>/dev/null || echo 1)"
          if [ "$commits" -le "$limit" ]; then
            echo "$commits commit(s) since the last compaction, limit $limit: no compaction."
            exit 0
          fi
          echo "$commits commits since the last compaction, over the limit of $limit;"
          echo "rebuilding $STORE_BRANCH from its own tip: same tree, one commit, no history."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `--orphan` keeps the index, so the new commit's tree is exactly what was tracked:
          # README, .gitignore, the versions and the counter. No `git add -A` here -- the
          # Actions cache is restored into store/data/cache, and `-A` would sweep 5.1 MB of
          # CelesTrak JSON into the very history this step exists to prevent.
          git checkout -q --orphan compacted
          echo 1 > data/.commits
          git add -f data/.commits
          git commit -q -m "Supplemental element-set store, compacted $(date -u +%Y-%m-%dT%H:%MZ)"
          git branch -q -M "$STORE_BRANCH"
          # Safe under the concurrency group above: one writer, and a push is atomic, so an
          # interrupted run leaves the previous tip standing rather than a half-written branch.
          git push -q -f origin "$STORE_BRANCH"
          echo "Compacted: one commit holding $(ls -1 data/supplemental | wc -l) version(s)."

      - name: What the store holds now
        working-directory: store
        run: |
          {
            echo "### Supplemental store"
            echo
            echo "| | |"
            echo "| --- | ---: |"
            echo "| Commits on \`$STORE_BRANCH\` | $(git rev-list --count HEAD) |"
            echo "| Versions stored | $(ls -1 data/supplemental 2>/dev/null | wc -l) |"
            echo "| Oldest | $(ls -1 data/supplemental 2>/dev/null | head -1) |"
            echo "| Newest | $(ls -1 data/supplemental 2>/dev/null | tail -1) |"
            echo "| Checkout size | $(du -sh data 2>/dev/null | cut -f1) |"
            echo "| History size (\`.git\`) | $(du -sh .git | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
